services:
  app:
    build:
      context: .
    image: bookingkom:latest
    restart: unless-stopped
    ports:
      - "9091:80"
    environment:
      APP_NAME: BookingKOM
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:9091}
      APP_KEY: ${APP_KEY:?Set APP_KEY in your .env (php artisan key:generate --show)}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kuala_Lumpur}
      DB_CONNECTION: sqlite
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      MAIL_MAILER: ${MAIL_MAILER:-log}
      BOOKINGKOM_RUN_SEEDER: ${BOOKINGKOM_RUN_SEEDER:-false}
    volumes:
      - bookingkom-database:/var/www/html/database
      - bookingkom-storage:/var/www/html/storage/app
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3

  queue:
    image: bookingkom:latest
    restart: unless-stopped
    depends_on:
      - app
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=3"]
    environment:
      APP_NAME: BookingKOM
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Set APP_KEY in your .env}
      DB_CONNECTION: sqlite
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
    volumes:
      - bookingkom-database:/var/www/html/database
      - bookingkom-storage:/var/www/html/storage/app

volumes:
  bookingkom-database:
  bookingkom-storage:
